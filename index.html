<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NBA Stats Tracker</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <h1>NBA Stats Tracker</h1>
    <input type="text" id="player-search" placeholder="Enter player name">
    <button id="search-btn">Search</button>

    <h2 id="player-name">Select a player</h2>

    <p>Points: <span id="player-pts">--</span></p>
    <p>Rebounds: <span id="player-reb">--</span></p>
    <p>Assists: <span id="player-ast">--</span></p>
</body>
</html>
